    <div id="contentbox">
        <h1>Tilauslomake</h1>

        <form id="tilauslomake" action="../PHP/tilaajantiedot.php" method="post">
            <h2>Tilaaja</h2>
            <section class="two_columns">
                <article>
                    <label for="orderer_first_name">Etunimi:</label><br>
                    <input class="input_text" type="text" id="orderer_first_name" name="orderer_first_name" required>
                </article>
                <article>
                    <label for="orderer_last_name">Sukunimi:</label><br>
                    <input class="input_text" type="text" id="orderer_last_name" name="orderer_last_name" required>
                </article>
                <article>
                    <label for="orderer_email">Email:</label><br>
                    <input class="input_text" type="email" id="orderer_email" name="orderer_email" required>
                </article>
                <article>
                    <label for="orderer_phone">Puhelinnumero:</label><br>
                    <input class="input_text" type="tel" id="orderer_phone" name="orderer_phone" required placeholder="+358">
                </article>
            </section>

            <h2>Toimitusosoite</h2>
            <section class="two_columns">
                <article class="merged_columns">
                    <label for="delivery_address">Katuosoite:</label><br>
                    <input class="input_text" type="text" id="delivery_address" name="delivery_address" required>
                </article>
                <article class="merged_columns">
                    <label for="delivery_address2">Katuosoite 2:</label><br>
                    <input class="input_text" type="text" id="delivery_address2" name="delivery_address2">
                </article>
                <article>
                    <label for="delivery_post_code">Postinumero:</label><br>
                    <input class="input_text" type="text" id="delivery_post_code" name="delivery_post_code" required>
                </article>
                <article>
                    <label for="delivery_post_area">Postitoimipaikka:</label><br>
                    <input class="input_text" type="text" id="delivery_post_area" name="delivery_post_area" required>
                </article>
            </section>

            <a href="ostoskori.html" class="button">← Edellinen</a>
            <button type="submit">Seuraava →</button>
        </form>
    </div>

    <footer>
        <section class="contact" id="contact">
            <div class="container">
                <h2>Ota yhteyttä</h2>
                <div class="contact-wrapper">
                    <div class="contact-form">
                        <h3>Lähetä meille viesti</h3>
                        <form id="yhteydenotto" action="https://printvalues.ew.r.appspot.com/printvalues" method="post">
                            <div class="form-group">
                                <input type="text" name="name" placeholder="Nimesi">
                            </div>
                            <div class="form-group">
                                <input type="email" name="email" placeholder="Sähköpostiosoitteesi">
                            </div>
                            <div class="form-group">
                                <textarea name="viesti" placeholder="Kirjoita viestisi tähän..."></textarea>
                            </div>
                            <div class="form-group checkbox">
                                <input type="checkbox" id="checkbox" name="checkbox">
                                <label for="checkbox">Liity postituslistalle</label>
                            </div>
                            <div class="form-group">
                                <button type="submit">Lähetä viesti</button>
                            </div>
                        </form>
                    </div>
                    <div class="contact-info">
                        <h3>Yhteystiedot</h3>
                        <p><i class="fas fa-phone"></i>040 123 4567</p>
                        <p><i class="fas fa-envelope"></i>info@kattis.fi</p>
                        <p><i class="fas fa-map-marker-alt"></i>Kattiskuja 12, 12345 Kattismaa</p>
                        <a href="index.html">
                            <img src="../images/kattislogo.jpg">
                        </a>
                    </div>
                </div>
            </div>
        </section>
